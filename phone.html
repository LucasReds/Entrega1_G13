<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arduino servo</title>
  </head>
  <body>
    <script src="https://app.protobject.com/framework/p.js"></script>
    <script src="config.js"></script>
    <h1>Arduino servo control</h1>
    <script>
      Protobject.Acceleration.start(50); 

      let buffer = [];
      const WINDOW = 600; // ms
      const KICK_THRESHOLD = 1;
      let lastKickTime = 0;

      Protobject.Acceleration.onData((data) => {
          console.log("ACCEL:", data);
          const now = Date.now();
          const norm = Math.sqrt(data.x**2 + data.y**2 + data.z**2);

          buffer.push({ t: now, v: norm });

          buffer = buffer.filter(p => now - p.t <= WINDOW);

          const peak = Math.max(...buffer.map(p => p.v));

          if (peak > KICK_THRESHOLD && now - lastKickTime > 800) {
              console.log("KICK DETECTED! Peak:", peak);

              Protobject.send({
                  type: "kick",
                  strength: peak
              });

              lastKickTime = now;
              buffer = []; 
          }
      });
      </script>

  </body>
</html>
